name: nifty-signal

# Daily pipeline: fetch (screener sweep + enrich) -> score (z-scores, VALUE
# composite, quality, return-potential, MTF after-tax) -> keyless AI analysis
# (daily commentary + per-top-pick why-cheap/key-risk, into the JSON) -> write
# data/*.json -> notify (top picks ONLY on STRONG BUY) -> commit (git-as-DB,
# rebase-before-push). The committed JSON drives the CF Pages build. Equity
# valuation moves slowly, so once/day at 12:30pm IST is the right cadence.

on:
  schedule:
    - cron: '0 7 * * 1-5' # 07:00 UTC = 12:30 PM IST, Mon-Fri (trading days); notify only on STRONG BUY
  workflow_dispatch:
  repository_dispatch:
    types: [tick]

permissions:
  contents: write

concurrency:
  group: nifty-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: nifty-tools-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            nifty-tools-${{ runner.os }}-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[browser,dev]"

      - name: Install Playwright Chromium (JS fallback)
        run: python -m playwright install chromium --with-deps

      - name: Run tests
        run: python -m pytest -q

      - name: Run pipeline (fetch -> score -> AI -> JSON -> notify STRONG BUY -> commit)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_BASE_URL: ${{ secrets.NTFY_BASE_URL }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          python -m nifty_signal --data data -v

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: nifty signal $(date -u +'%F %H:%MZ')"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Alert on failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ oriz-nifty-signal scrape workflow FAILED — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null || true
          fi
