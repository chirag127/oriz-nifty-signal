name: deploy

# Redeploy the Astro site to Cloudflare Pages whenever the site or the daily
# data JSON changes. The scrape.yml cron commits data/*.json daily; that push
# to data/** fires this workflow, so the screener always rebuilds with fresh
# numbers even though CF Pages git-integration isn't wired to this repo.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-nifty
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci || npm install --no-audit --no-fund

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy dist --project-name=oriz-nifty-signal
